<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e9f4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbe7ff"/>
      <stop offset="1" stop-color="#b9cdf5"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0d1526" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0d1526" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sombra en el piso -->
  <ellipse cx="400" cy="372" rx="360" ry="22" fill="url(#shadow)"/>

  <!-- carrocería -->
  <path d="M48 292 L48 246 Q48 228 70 224 L180 206 L262 136 Q274 124 296 122 L506 118 Q536 118 552 134 L618 202 L728 218 Q752 223 752 248 L752 292 Z"
        fill="url(#body)" stroke="#0d1526" stroke-width="4" stroke-linejoin="round"/>

  <!-- ventanas -->
  <path d="M284 144 L262 200 L408 200 L408 140 Z" fill="url(#glass)" stroke="#0d1526" stroke-width="3" stroke-linejoin="round"/>
  <path d="M424 140 L424 200 L572 200 L528 146 Q522 140 510 140 Z" fill="url(#glass)" stroke="#0d1526" stroke-width="3" stroke-linejoin="round"/>

  <!-- línea de cintura y puertas -->
  <path d="M150 232 L700 232" stroke="#0d1526" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M416 142 L416 290" stroke="#0d1526" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="380" y="226" width="26" height="6" rx="3" fill="#0d1526" fill-opacity="0.55"/>
  <rect x="440" y="226" width="26" height="6" rx="3" fill="#0d1526" fill-opacity="0.55"/>

  <!-- vista interna del motor (capó) -->
  <g>
    <rect x="76" y="238" width="132" height="46" rx="8" fill="#16213a" fill-opacity="0.94"/>
    <rect x="88" y="246" width="30" height="30" rx="4" fill="#394a6e"/>
    <rect x="124" y="246" width="30" height="30" rx="4" fill="#4a5d86"/>
    <rect x="160" y="246" width="30" height="30" rx="4" fill="#394a6e"/>
    <path d="M96 242 v-14 M132 242 v-18 M168 242 v-14" stroke="#9fbcff" stroke-width="3" stroke-linecap="round"/>
    <!-- resorte -->
    <path d="M196 214 l10 6 l-12 6 l12 6 l-12 6 l12 6 l-12 6" stroke="#2f6fed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- tubo de escape / chasis -->
  <path d="M250 296 L560 296" stroke="#0d1526" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
  <path d="M560 296 L726 296" stroke="#2f6fed" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>

  <!-- faros -->
  <path d="M52 250 L96 246 L96 262 L52 266 Z" fill="#dbe7ff" stroke="#0d1526" stroke-width="3" stroke-linejoin="round"/>
  <path d="M734 236 L748 240 L748 262 L734 262 Z" fill="#2f6fed" stroke="#0d1526" stroke-width="3" stroke-linejoin="round"/>

  <!-- ruedas -->
  <g>
    <path d="M118 292 A72 72 0 0 1 262 292" fill="#f6f8fc" stroke="#0d1526" stroke-width="4"/>
    <circle cx="190" cy="300" r="56" fill="#0d1526"/>
    <circle cx="190" cy="300" r="38" fill="#e8edf7" stroke="#16213a" stroke-width="3"/>
    <circle cx="190" cy="300" r="22" fill="#2f6fed"/>
    <circle cx="190" cy="300" r="9" fill="#0d1526"/>
    <path d="M190 262 V338 M152 300 H228 M163 273 L217 327 M217 273 L163 327" stroke="#16213a" stroke-width="3"/>
  </g>
  <g>
    <path d="M538 292 A72 72 0 0 1 682 292" fill="#f6f8fc" stroke="#0d1526" stroke-width="4"/>
    <circle cx="610" cy="300" r="56" fill="#0d1526"/>
    <circle cx="610" cy="300" r="38" fill="#e8edf7" stroke="#16213a" stroke-width="3"/>
    <circle cx="610" cy="300" r="22" fill="#2f6fed"/>
    <circle cx="610" cy="300" r="9" fill="#0d1526"/>
    <path d="M610 262 V338 M572 300 H648 M583 273 L637 327 M637 273 L583 327" stroke="#16213a" stroke-width="3"/>
  </g>
</svg>
