<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" fill="none">
  <!-- Imagen de motor de ejemplo. Reemplázala por la tuya (PNG con fondo transparente) en public/motor.png
       y cambia MOTOR_IMG en src/layouts/AuthLayout.astro a '/motor.png'. -->
  <defs>
    <linearGradient id="mb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe3f1"/>
    </linearGradient>
    <linearGradient id="mh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b86f5"/>
      <stop offset="1" stop-color="#1d4fd8"/>
    </linearGradient>
    <radialGradient id="ms" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="320" cy="410" rx="260" ry="16" fill="url(#ms)"/>

  <!-- cárter -->
  <path d="M150 330 L170 372 Q176 384 192 384 L430 384 Q446 384 452 372 L472 330 Z" fill="url(#mb)" stroke="#0d1526" stroke-width="4" stroke-linejoin="round"/>
  <path d="M300 384 L300 396 L340 396 L340 384" stroke="#0d1526" stroke-width="4" stroke-linejoin="round"/>

  <!-- bloque -->
  <rect x="130" y="206" width="360" height="126" rx="10" fill="url(#mb)" stroke="#0d1526" stroke-width="4"/>
  <path d="M130 262 H490" stroke="#0d1526" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="156" cy="232" r="6" fill="#0d1526" fill-opacity="0.8"/>
  <circle cx="464" cy="232" r="6" fill="#0d1526" fill-opacity="0.8"/>
  <circle cx="156" cy="306" r="6" fill="#0d1526" fill-opacity="0.8"/>
  <circle cx="464" cy="306" r="6" fill="#0d1526" fill-opacity="0.8"/>

  <!-- tapa de válvulas -->
  <rect x="146" y="140" width="328" height="74" rx="12" fill="url(#mh)" stroke="#0d1526" stroke-width="4"/>
  <path d="M176 156 V198 M226 156 V198 M276 156 V198 M326 156 V198 M376 156 V198 M426 156 V198" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>

  <!-- bobinas y bujías -->
  <rect x="190" y="98" width="30" height="46" rx="6" fill="#0d1526"/>
  <rect x="262" y="98" width="30" height="46" rx="6" fill="#0d1526"/>
  <rect x="334" y="98" width="30" height="46" rx="6" fill="#0d1526"/>
  <rect x="406" y="98" width="30" height="46" rx="6" fill="#0d1526"/>
  <path d="M205 98 V84 M277 98 V84 M349 98 V84 M421 98 V84" stroke="#2f6fed" stroke-width="5" stroke-linecap="round"/>

  <!-- múltiple de admisión -->
  <path d="M146 176 H96 Q74 176 74 198 V270 Q74 292 96 292 H130" stroke="#0d1526" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M146 176 H96 Q74 176 74 198 V270 Q74 292 96 292 H130" stroke="url(#mb)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- múltiple de escape -->
  <path d="M490 252 H540 Q562 252 562 274 V336" stroke="#0d1526" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M490 252 H540 Q562 252 562 274 V336" stroke="#8aa3cf" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- polea y correa -->
  <path d="M500 296 L560 296" stroke="#0d1526" stroke-width="4" stroke-opacity="0"/>
  <circle cx="404" cy="332" r="46" fill="url(#mb)" stroke="#0d1526" stroke-width="4"/>
  <circle cx="404" cy="332" r="26" fill="none" stroke="#0d1526" stroke-opacity="0.35" stroke-width="3"/>
  <circle cx="404" cy="332" r="11" fill="#2f6fed" stroke="#0d1526" stroke-width="4"/>
  <circle cx="248" cy="300" r="34" fill="url(#mb)" stroke="#0d1526" stroke-width="4"/>
  <circle cx="248" cy="300" r="9" fill="#0d1526"/>
  <path d="M248 266 L404 286 M248 334 L404 378" stroke="#0d1526" stroke-width="5" stroke-linecap="round"/>
</svg>
